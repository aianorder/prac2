[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aianorder-prac2"
version = "0.1.0"
description = "CartPole behavior cloning and plots for Highway evaluation results."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "aianorder"}]
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "gymnasium[classic-control]>=1.0,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
prac-cartpole-single = "single_agent.cartpole_bc:main"
prac-cartpole-two = "two_agents.cartpole_bc:main"
prac-highway-plot = "plot_highway:main"

[project.urls]
Repository = "https://github.com/aianorder/prac2"

[tool.setuptools]
py-modules = ["plot_highway", "practice_io", "make_diffs"]

[tool.setuptools.packages.find]
where = ["."]
include = ["single_agent*", "two_agents*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
